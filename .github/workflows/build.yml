name: Build CAS HomeNet Guard
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: dotnet publish CasHomeNetGuard.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: CasHomeNetGuard-win-x64
          path: publish/CasHomeNetGuard.exe
